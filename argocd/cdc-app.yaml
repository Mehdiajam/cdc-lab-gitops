apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cdc-lab-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Mehdiajam/cdc-lab-gitops.git'
    path: .
    targetRevision: HEAD
    directory:
      recurse: true
      include: '{kafka/*.yaml,debezium/*.yaml,connector-configs/*.yaml,kafka-ui/*.yaml,grafana-dashboards/*.yaml}'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
