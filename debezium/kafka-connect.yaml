apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      volumes:
        - name: jmx-exporter
          emptyDir: {}
        - name: jmx-config
          configMap:
            name: connect-metrics
      initContainers:
        - name: download-jmx-exporter
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args: ["curl -L -o /jmx/jmx_prometheus_javaagent.jar https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/0.20.0/jmx_prometheus_javaagent-0.20.0.jar"]
          volumeMounts:
            - name: jmx-exporter
              mountPath: /jmx
      containers:
        - name: kafka-connect
          image: quay.io/debezium/connect:2.6.2.Final
          volumeMounts:
            - name: jmx-exporter
              mountPath: /jmx
            - name: jmx-config
              mountPath: /jmx-config
          ports:
            - containerPort: 8083
              name: rest
            - containerPort: 8080
              name: metrics
          env:
            - name: JMX_PORT
              value: "9999"
            - name: KAFKA_OPTS
              value: "-javaagent:/jmx/jmx_prometheus_javaagent.jar=8080:/jmx-config/config.yaml"
            - name: CONNECT_CONFIG_PROVIDERS
              value: "env"
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-user
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: postgres-password
                  optional: true
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mysql-user
                  optional: true
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: mysql-password
                  optional: true
            - name: BOOTSTRAP_SERVERS
              value: "cdc-kafka-kafka-bootstrap:9092"
            - name: GROUP_ID
              value: "cdc-connect-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "cdc-connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "cdc-connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "cdc-connect-status"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: kafka
spec:
  selector:
    app: kafka-connect
  ports:
    - port: 8083
      targetPort: 8083
      name: rest
    - port: 8080
      targetPort: 8080
      name: metrics
