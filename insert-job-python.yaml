apiVersion: batch/v1
kind: Job
metadata:
  name: insert-dummy-data
spec:
  template:
    spec:
      containers:
      - name: python-client
        image: python:3.9-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install pymysql && python -c "
          import pymysql, time
          conn = pymysql.connect(host='host.docker.internal', user='debezium', password='dbz_password', database='cdc_test')
          with conn.cursor() as cur:
              cur.execute(\"INSERT INTO customers (first_name, last_name, email) VALUES ('Test', 'User', 'test\" + str(time.time()) + \"@example.com')\")
          conn.commit()
          conn.close()
          print('Inserted successfully!')
          "
      restartPolicy: Never
  backoffLimit: 1
